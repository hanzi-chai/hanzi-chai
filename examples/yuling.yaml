version: '0.4'
source: yuling
info:
  name: 灵明
  author: 朱宇浩
  version: 3.11.0-beta
  description: |
    基于宇浩拆分、编码自分割、纯二十五键、四码限长、三编字根、完全音托、全汉字集、繁简通打输入方案。
    方案名取自《尚书大传》之「明明上天配天之灵」。
analysis:
  classifier:
    竖钩: 5
    竖提: 6
    竖折: 6
    竖弯: 6
    竖弯钩: 6
    竖折撇: 6
    竖折折钩: 6
    竖折折: 6
    撇点: 6
    撇折: 6
    斜钩: 6
  degenerator:
    feature:
      提: 横
      捺: 点
    no_cross: false
  selector:
    - 根少优先
    - 结构完整
    - 连续笔顺
    - 能连不交
    - 能散不连
    - 少弱字根
    - 取大优先
